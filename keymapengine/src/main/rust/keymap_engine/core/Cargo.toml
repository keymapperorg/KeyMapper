[package]
name = "keymap_engine_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "keymap_engine_core"
crate-type = ["rlib"]

[dependencies]

slotmap = "1.0"
tokio = { version = "1.48.0", features = ["sync", "time"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
proptest = "1"
tokio = { version = "1.48.0", features = ["rt", "macros", "time", "test-util"] }
